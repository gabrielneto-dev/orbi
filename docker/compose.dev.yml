# Ambiente local de desenvolvimento: PostgreSQL 17 + MinIO (armazenamento S3).
# Valores vêm do .env na raiz do repositório (copie de .env.example). Use os scripts:
#   pnpm services:up    → docker compose --env-file .env -f docker/compose.dev.yml up -d
#   pnpm services:down  → para os contêineres (os dados ficam nos volumes)
name: orbi-dev

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: orbi
      TZ: UTC
    ports:
      # 5433 por padrão para não colidir com um PostgreSQL instalado na máquina.
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orbi"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    # A MinIO deixou de publicar imagens da edição comunitária; esta é compilada do código-fonte
    # pela Chainguard. Só para desenvolvimento local (produção usa R2/B2, ver CTX-DEC-20261105-tech-stack).
    image: cgr.dev/chainguard/minio:latest
    restart: unless-stopped
    command: ["server", "/data", "--address", ":9000", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?defina S3_ACCESS_KEY_ID no .env}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?defina S3_SECRET_ACCESS_KEY no .env}
    ports:
      - "127.0.0.1:${MINIO_API_PORT:-9000}:9000"
      - "127.0.0.1:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data

  # Cria o bucket de anexos (idempotente) e termina. Tenta de novo até o MinIO aceitar conexões.
  minio-init:
    image: cgr.dev/chainguard/minio-client:latest
    depends_on:
      minio:
        condition: service_started
    restart: on-failure
    environment:
      MC_HOST_local: http://${S3_ACCESS_KEY_ID}:${S3_SECRET_ACCESS_KEY}@minio:9000
    command: ["mb", "--ignore-existing", "local/${S3_BUCKET:?defina S3_BUCKET no .env}"]

volumes:
  postgres-data:
  minio-data:
