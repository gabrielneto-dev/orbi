context_engineering_version: 1

project: orbi
root: Context
content_language: pt-BR   # see CTX-ASM-20261104-context-language-pt-br

strategy:
  progressive_loading: true
  atomic_documents: true
  preserve_history: true
  controlled_writes: true

retrieval:
  initial_files:
    - MAP.md
    - STATE.md
  default_relation_depth: 1
  prefer_active_records: true

persistence:
  trigger_mode: explicit
  create_checkpoint_on_save: true
  update_state_on_save: true
  update_catalog_on_save: true

naming:
  files: kebab-case
  record_file_pattern: "<TYPE>-<YYYYMMDD>-<slug>.md"
  checkpoint_file_pattern: "CP-<YYYYMMDD>-<HHMM>-<slug>.md"
  id_pattern: "CTX-<TYPE>-<YYYYMMDD>[-<HHMM>]-<slug>"
  ids: stable

metadata:
  format: yaml-frontmatter
  required:
    - id
    - type
    - title
    - branch
    - tags
    - status
    - created_at
    - updated_at

tooling:
  validator: _meta/tools/context_check.py
  catalog: _meta/catalog.jsonl

security:
  allow_credentials: false
  allow_secrets: false
